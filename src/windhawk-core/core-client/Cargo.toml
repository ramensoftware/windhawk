[package]
name = "windhawk-core-client"
description = "Raw C ABI transport for windhawk-core.dll, shared by the bridge and the native CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deliberately outside the core layering, like the bridge: it reaches the core
# only through the C ABI and depends on libloading ALONE - no core crate, no
# serde_json, no windhawk-core-protocol - returning raw envelope strings.
[dependencies]
libloading = { workspace = true }
