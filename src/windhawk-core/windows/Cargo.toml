[package]
name = "windhawk-core-windows"
description = "Win32 implementations of the windhawk-core ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
windhawk-core-ports = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    # The installed font families (fonts.rs): EnumFontFamiliesExW over the
    # screen DC.
    "Win32_Graphics_Gdi",
    "Win32_Security",
    # The private temp directory's descriptor is built from an SDDL string
    # (ConvertStringSecurityDescriptorToSecurityDescriptorW).
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_Networking_WinHttp",
    "Win32_UI_Shell",
    # The hotkey capture (hotkey_capture.rs): the low-level keyboard hook, the
    # thread message loop and timer, the foreground-change event hook, and the
    # virtual-key codes of the modifiers.
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    # The case folding of the INI name lookup (ini.rs): RtlUpcaseUnicodeChar.
    "Wdk_System_SystemServices",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
