[package]
name = "windhawk-core-windows"
description = "Win32 implementations of the windhawk-core ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
windhawk-core-ports = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_Networking_WinHttp",
] }

[dev-dependencies]
tempfile = { workspace = true }
# The WOW64 registry test (adapters.rs) gates on process elevation via the token
# API; integration tests do not inherit the crate's normal dependencies.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
